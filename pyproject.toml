[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vyrbind"
version = "0.1.0"
description = "Fail-closed deterministic local action boundary for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "vYronFORGE."}]
keywords = ["ai-safety", "agent-security", "policy", "reference-implementation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
vyrbind = "vyrbind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
